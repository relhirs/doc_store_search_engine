name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Lets a running deployment finish, so the site is never left half updated
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # verify.sh needs Node as well as Java
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/web/package-lock.json

      # verify.sh skips these tests, so this step is what stops a failing test from deploying
      - name: Test Stage 6
        working-directory: stage6
        run: mvn -B install

      - name: Build the engine and compare it with the JVM
        run: sh demo/engine/verify.sh

      - name: Install web dependencies
        working-directory: demo/web
        run: npm ci

      - name: Build the web app
        working-directory: demo/web
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
